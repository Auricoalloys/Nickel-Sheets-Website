# Local-build overlay. GitHub Pages reads only _config.yml, so nothing here
# affects production.
#
# This file used to exclude thirteen NiCr pages whose permalinks contained a
# colon (/NiCr/80:20/plates/). Those built on the Linux builders GitHub Pages
# uses but not on Windows, where a colon is illegal in a filename. The
# permalinks now use hyphens, so the whole site builds on Windows from
# _config.yml alone and this overlay is no longer needed for that.
#
# It is kept only because _config.local.yml must exclude itself from the output
# when it is used. If you have no local-only overrides to add, build with:
#   bundle exec jekyll build
#
# Usage with this overlay:
#   bundle exec jekyll build --config _config.yml,_config.local.yml
exclude:
  - README.md
  - CLAUDE.md
  - package-lock.json
  - node_modules
  - .vscode
  - desktop.ini
  - "**/desktop.ini"
  - docs/product-page-migration.md
  - docs/apps-script
  # camera originals, superseded by the WebP versions beside them
  - docs/images/source
  - Gemfile
  - Gemfile.lock
  - vendor
  - _config.local.yml
