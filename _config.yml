permalink: pretty

# Generates a redirect stub at every URL listed in a page's redirect_from, so a
# retired duplicate keeps sending visitors and crawlers to the page that kept
# the links. GitHub Pages whitelists this plugin, but only loads it when it is
# named here.
plugins:
  - jekyll-redirect-from

# Site identity, available to templates and used when generating the sitemap.
title: Aurico Alloys LLP
url: https://www.nickelsheets.com
description: >-
  Global supplier and stockist of pure nickel strips, nickel alloys, titanium,
  duplex and stainless steel, and cobalt alloys in sheet, plate, bar, coil,
  foil, wire, pipe, tube and fitting form.

# Keep working files out of the published site. Note that html/ is NOT excluded:
# header.html, footer.html and product_detailed_page.html are fetched at runtime
# by product-page-runtime.js, so they have to be served.
exclude:
  # Audit tooling. Runs in CI, never part of the published site.
  - tools
  - README.md
  # Notes for Claude Code. Markdown without front matter is still rendered into
  # a page by the optional-front-matter plugin GitHub Pages always enables, so
  # this has to be excluded or it publishes at /CLAUDE.html.
  - CLAUDE.md
  # github-pages already excludes README.md by default; stated here so it stays
  # excluded if that default ever changes.
  - README.md
  - package-lock.json
  - node_modules
  - .vscode
  - desktop.ini
  - "**/desktop.ini"
  - docs/product-page-migration.md
  # Apps Script source for the enquiry endpoint. Lives here so it is versioned
  # alongside the form that posts to it, but it is not part of the site.
  - docs/apps-script
  # Build tools, versioned beside what they produce.
  - docs/purge-bootstrap.mjs
  - docs/build-sitemap.mjs
  - docs/build-search-index.mjs
  - docs/build-prices.mjs
  - docs/build-specs.mjs
  - docs/specs.csv
  - docs/build-cuts.mjs
  - docs/build-price-worklist.mjs
  # The grade database and its generator. These were added without exclusions
  # and were being copied into _site and served: the generator's own source, the
  # three CSVs behind it, and grades.json - which the notes describe as not
  # published "until that exclusion is lifted deliberately". It never was.
  # docs/ is not excluded wholesale; every file here is listed one by one, which
  # is how the whole set was missed.
  - docs/build-grades.mjs
  - docs/grades.csv
  - docs/chemistry.csv
  - docs/properties.csv
  - docs/grades.json
  # The queue of pages still waiting for a price. A working file, not a page:
  # it lists what the site does not yet quote, which is nobody else’s business.
  - prices-todo.csv
  # Powder technical data sheets and their generator. Standalone HTML meant to be
  # printed to PDF, not served: they carry no front matter, so the sitemap
  # generator already skips them, but Jekyll would still copy them into _site
  # and publish them at a URL nothing links to.
  - docs/powder-datasheets
  - docs/build-local.sh
  # camera originals, superseded by the WebP versions beside them
  - docs/images/source
  # Reference documents (standards excerpts, sourcing notes). Tracked in git
  # so the sourcing is auditable, but not site content.
  - docs/references
  # local build toolchain, not site content
  - Gemfile
  - Gemfile.lock
  - vendor
