name: SEO audit

# Runs the checks in tools/seo_audit.py against the repository.
#
# It reports; it never edits or publishes. Every check corresponds to a bug that
# has actually occurred on this site, so a count above the baseline means
# something regressed.
#
# On a pull request it fails the check, so a regression is caught before it
# reaches the live site. On a push to main it does both: the change is already
# published, so it raises an issue to act on and fails the run so the commit
# carries the mark. On the daily schedule it raises an issue only.

on:
  schedule:
    - cron: "30 2 * * *"      # 08:00 IST
  # The two path lists are identical on purpose, and GitHub Actions does not
  # support YAML anchors, so they are spelled out twice. They used to differ and
  # push was the shorter one: a commit straight to main touching only the audit,
  # its baseline or a generator ran no check at all. This repo does commit
  # straight to main, so that was the likelier path, not the rarer one.
  #
  # The workflow file is in the list so that a change to the guard exercises the
  # guard.
  pull_request:
    paths:
      - "**.html"
      - "_includes/**"
      - ".github/workflows/seo-audit.yml"
      - "tools/seo_audit.py"
      - "tools/seo_baseline.json"
      - "robots.txt"
      - "prices.csv"
      - "docs/build-prices.mjs"
      - "docs/specs.csv"
      - "docs/build-specs.mjs"
      - "docs/grades.csv"
      - "docs/chemistry.csv"
      - "docs/properties.csv"
      - "docs/build-grades.mjs"
      - "docs/hub-grades.csv"
      - "docs/build-hub-grades.mjs"
      - "docs/materials.csv"
      - "docs/build-weight-data.mjs"
      - "javascript/weight-data.js"
      - "CSS/**"
      - "docs/check-tables.mjs"
  push:
    branches: [main]
    paths:
      - "**.html"
      - "_includes/**"
      - ".github/workflows/seo-audit.yml"
      - "tools/seo_audit.py"
      - "tools/seo_baseline.json"
      - "robots.txt"
      - "prices.csv"
      - "docs/build-prices.mjs"
      - "docs/specs.csv"
      - "docs/build-specs.mjs"
      - "docs/grades.csv"
      - "docs/chemistry.csv"
      - "docs/properties.csv"
      - "docs/build-grades.mjs"
      - "docs/hub-grades.csv"
      - "docs/build-hub-grades.mjs"
      - "docs/materials.csv"
      - "docs/build-weight-data.mjs"
      - "javascript/weight-data.js"
      - "CSS/**"
      - "docs/check-tables.mjs"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A published price the HTML no longer matches is worse than no price:
      # Google uses the field only while it stays accurate. This fails the build
      # if prices.csv was edited without re-running the generator.
      - name: Prices match prices.csv
        run: node docs/build-prices.mjs --check

      # A specification is written for a product form, and citing one for the
      # wrong form tells a buyer the material is certified to something it is
      # not. The hub tables are generated, so this fails the build if specs.csv
      # was edited without re-running the generator.
      - name: Spec tables match docs/specs.csv
        run: node docs/build-specs.mjs --check

      # A UNS number is the strongest claim a page makes - it tells a buyer
      # exactly which material they are being offered. This fails the build when
      # grades.csv, chemistry.csv or properties.csv was edited without re-running
      # the generator, and when those files disagree with specs.csv about what a
      # grade is.
      #
      # --strict also fails on the LINT: a page whose title, meta description,
      # og/twitter tags or JSON-LD name cites a UNS or Werkstoff number that
      # contradicts grades.csv. That was reported-but-tolerated while a backlog
      # existed - 31 findings on the day the lint was written, 20 when this step
      # was added, and failing then would have blocked every unrelated PR.
      #
      # The backlog reached 0 on 2026-08-26 when the Nichrome family was sourced
      # to VDM Metals, so the guard is closed. A new contradiction now fails the
      # PR that introduces it, which is the whole point: this check exists
      # because 4 grades were publishing conflicting UNS numbers and nothing
      # stopped the fifth.
      #
      # If this step fails, do NOT reach for the page first. Two of the last
      # seven findings were the CSV being wrong about a page that was right -
      # a "-" in the uns column claims the mill publishes no such designation.
      - name: Grade data matches docs/grades.csv
        run: node docs/build-grades.mjs --check --strict

      # The "Grades Supplied" table on each family hub is generated, and its UNS
      # column is joined from grades.csv so it cannot drift from the grade
      # database - one hub used to show CoCrMo as R31538 where grades.csv says
      # R31537. This fails the build when hub-grades.csv was edited without
      # re-running the generator, and when a hub lists a grade that grades.csv
      # has no row for, which leaves the UNS with nowhere to come from.
      #
      # It was the last generator with a --check that CI did not run, and it had
      # been failing unnoticed since it was added: it compared byte-for-byte
      # against a working tree that is CRLF wherever core.autocrlf is true, so
      # every hub reported stale on a tree with no drift in it at all.
      - name: Hub grade tables match docs/hub-grades.csv
        run: node docs/build-hub-grades.mjs --check

      # The weight calculator's material list is generated from grades.json and
      # docs/materials.csv. It is checked for the same reason the hub tables
      # are: the density a visitor calculates with is joined from the same
      # verified grade database that prints the identity table on the product
      # pages, and the two must not be able to disagree. It also fails when the
      # two families that file a grade twice stop agreeing on its density, which
      # is a contradiction in grades.csv rather than in the calculator.
      - name: Weight calculator data matches the grade database
        run: node docs/build-weight-data.mjs --check

      # Every table on the site uses one system. It used to use three, and which
      # one a <th> obeyed came down to the order of two <link> tags: `.table th`
      # and Bootstrap's own cell rule are both specificity (0,1,1), so 391 pages
      # rendered a row header white and 336 rendered it navy across 8,349 cells,
      # and on six pages a navy link landed on a navy cell and disappeared.
      #
      # This fails the build when the system block in CSS/pages.css and
      # CSS/tables.css drift apart, when a table carries a class no stylesheet
      # defines, and when a page styles a table in its own <style> block - which
      # is how three tables came to be set a tenth smaller than the rest.
      - name: Tables use one system
        run: node docs/check-tables.mjs

      - name: Run audit
        id: audit
        run: |
          # --live adds the apex domain checks: they need network access, so
          # they run here rather than on every local invocation.
          python tools/seo_audit.py --live | tee audit.txt
          echo "---"
          # --fail-on-new exits 1 only when a count exceeds the baseline
          python tools/seo_audit.py --live --fail-on-new
        continue-on-error: true

      - name: Full findings
        if: steps.audit.outcome == 'failure'
        run: python tools/seo_audit.py --live --json > audit.json && cat audit.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit
          path: |
            audit.txt
            audit.json
          if-no-files-found: ignore

      # The scheduled run has no PR to annotate, so it raises an issue - and so
      # does a push, because a regression that reaches main is already live:
      # GitHub Pages deploys from main and does not gate on this workflow. A red
      # tick on a commit is easy to miss, and this repo does commit straight to
      # main, which is the path most likely to carry a regression.
      #
      # This step deliberately comes before the failing one. A step that exits 1
      # ends the job, so the other order would collect the findings and then
      # never file them - which is exactly the bug being fixed here: the push
      # verdict used to be computed, uploaded and discarded.
      - name: Open an issue on regression
        if: steps.audit.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'push')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit.txt', 'utf8');
            const title = 'SEO audit: regression detected';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'seo-audit'
            });
            const body = 'The daily SEO audit found counts above the baseline.\n\n' +
                         '```\n' + report + '```\n\n' +
                         'Baseline: `tools/seo_baseline.json`, and every count in it is 0. ' +
                         'If a finding is deliberate, teach the check to recognise it - ' +
                         'raising the number hides the next real one.';
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['seo-audit']
              });
            }

      # A pull request fails so the regression never merges; a push fails so the
      # commit itself carries the mark. The schedule is exempt: it has just
      # raised an issue, and a red cron run every morning is noise nobody reads.
      - name: Fail on regression
        if: steps.audit.outcome == 'failure' && github.event_name != 'schedule'
        run: |
          echo "SEO regression - see the report above."
          exit 1
