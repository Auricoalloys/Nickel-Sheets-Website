name: SEO audit

# Runs the checks in tools/seo_audit.py against the repository.
#
# It reports; it never edits or publishes. Every check corresponds to a bug that
# has actually occurred on this site, so a count above the baseline means
# something regressed.
#
# On a pull request it fails the check, so a regression is caught before it
# reaches the live site. On the daily schedule it opens an issue instead.

on:
  schedule:
    - cron: "30 2 * * *"      # 08:00 IST
  pull_request:
    paths:
      - "**.html"
      - "_includes/**"
      - "tools/seo_audit.py"
      - "prices.csv"
      - "docs/build-prices.mjs"
      - "docs/specs.csv"
      - "docs/build-specs.mjs"
      - "docs/grades.csv"
      - "docs/chemistry.csv"
      - "docs/build-grades.mjs"
  push:
    branches: [main]
    paths:
      - "**.html"
      - "_includes/**"
      - "prices.csv"
      - "docs/specs.csv"
      - "docs/grades.csv"
      - "docs/chemistry.csv"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A published price the HTML no longer matches is worse than no price:
      # Google uses the field only while it stays accurate. This fails the build
      # if prices.csv was edited without re-running the generator.
      - name: Prices match prices.csv
        run: node docs/build-prices.mjs --check

      # A specification is written for a product form, and citing one for the
      # wrong form tells a buyer the material is certified to something it is
      # not. The hub tables are generated, so this fails the build if specs.csv
      # was edited without re-running the generator.
      - name: Spec tables match docs/specs.csv
        run: node docs/build-specs.mjs --check

      # A UNS number is the strongest claim a page makes - it tells a buyer
      # exactly which material they are being offered. This fails the build when
      # grades.csv or chemistry.csv was edited without re-running the generator,
      # and when the two files disagree with specs.csv about what a grade is.
      #
      # Contradictions found by the lint are reported but do not fail yet: 31
      # pages carry an identifier that needs checking against a mill bulletin
      # before it can be corrected, and failing now would block every unrelated
      # PR. Add --strict once that backlog is cleared, and this guard closes.
      - name: Grade data matches docs/grades.csv
        run: node docs/build-grades.mjs --check

      - name: Run audit
        id: audit
        run: |
          # --live adds the apex domain checks: they need network access, so
          # they run here rather than on every local invocation.
          python tools/seo_audit.py --live | tee audit.txt
          echo "---"
          # --fail-on-new exits 1 only when a count exceeds the baseline
          python tools/seo_audit.py --live --fail-on-new
        continue-on-error: true

      - name: Full findings
        if: steps.audit.outcome == 'failure'
        run: python tools/seo_audit.py --live --json > audit.json && cat audit.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit
          path: |
            audit.txt
            audit.json
          if-no-files-found: ignore

      # A pull request should simply fail, so the regression never merges.
      - name: Fail the PR on regression
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "SEO regression - see the report above."
          exit 1

      # The scheduled run has no PR to annotate, so it raises an issue.
      - name: Open an issue on regression
        if: steps.audit.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit.txt', 'utf8');
            const title = 'SEO audit: regression detected';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'seo-audit'
            });
            const body = 'The daily SEO audit found counts above the baseline.\n\n' +
                         '```\n' + report + '```\n\n' +
                         'Baseline: `tools/seo_baseline.json`. ' +
                         'If a change is intentional, update the baseline in the same PR.';
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['seo-audit']
              });
            }
